function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eo=k=>1-Math.pow(1-k,3);
const eo5=k=>1-Math.pow(1-k,5);
const back=k=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function txt(s,x,y,{size=40,weight=400,color=INK,align="left",ls=0,base="alphabetic"}={}){ctx.font=`${weight} ${size}px "Geist"`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.letterSpacing=ls+"px";ctx.fillText(s,x,y);ctx.letterSpacing="0px"}
function kf(t,frames){if(t<=frames[0][0])return frames[0].slice(1);for(let i=1;i<frames.length;i++){if(t<=frames[i][0]){const a=frames[i-1],b=frames[i];const k=eio(seg(t,a[0],b[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],k))}}return frames[frames.length-1].slice(1)}
function reveal(k,fn){if(k<=0)return;ctx.save();ctx.globalAlpha*=k;const b=(1-k)*12;if(b>0.3)ctx.filter=`blur(${b.toFixed(1)}px)`;ctx.translate(0,(1-k)*22);fn();ctx.restore()}

function monotone(xs,ys){const n=xs.length,d=[],m=new Array(n);for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);m[i]=k*a*d[i];m[i+1]=k*b*d[i]}}
  return x=>{if(x<=xs[0])return ys[0];if(x>=xs[n-1])return ys[n-1];let i=0;while(x>xs[i+1])i++;const h=xs[i+1]-xs[i],u=(x-xs[i])/h,u2=u*u,u3=u2*u;return(2*u3-3*u2+1)*ys[i]+(u3-2*u2+u)*h*m[i]+(-2*u3+3*u2)*ys[i+1]+(u3-u2)*h*m[i+1]}}
const WARP=[[0,0],[5.4,5.9],[6.5,7.1],[9.4,10.6],[10.5,13.4],[11.7,14.9],[14.1,18.0],[15.4,19.4],[16.2,21.0],[19.6,25.0],[21.6,27.4],[23.0,29.6],[26.4,33.6],[28.1,35.6],[28.8,36.4],[29.9,37.6],[33.9,42.4],[34.8,43.4],[36.0,45.0],[38.4,47.8],[40.3,50.1],[41.4,51.4],[42.3,52.5],[46.7,56.8]];

function card(x,y,s,v,a,{shimmer=-1}={}){

  ctx.fillStyle="#24242B";rr(ctx,-w/2+20,-h/2+152,250,13,6.5);ctx.fill();rr(ctx,-w/2+20,-h/2+174,170,13,6.5);ctx.fill();

  ctx.fillStyle=`hsl(${hue} 70% 62%)`;rr(ctx,w/2-96,h/2-36,76,24,12);ctx.fill();

    ctx.save();rr(ctx,-w/2,-h/2,w,h,26);ctx.clip();

  }
  ctx.restore();
}

  const a=seg(t,6.4,7.2)*(1-seg(t,50.9,51.6));if(a<=0)return;

}
function pill(x,y,text,{color=INK,dot=null,size=20,bg="#fff",border="#E6E6EE",a=1,weight=500,align="center"}={}){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font=`${weight} ${size}px "Geist"`;const tw=ctx.measureText(text).width;const pad=size*0.9,dw=dot?size*1.1:0;const w=tw+pad*2+dw,h=size*2.1;

  ctx.strokeStyle=border;ctx.lineWidth=1.2;ctx.stroke();

}

const T1=45.0,T2=47.8;
const LAY=[
  {A:["A",[0,0]],B:["B",[0,0]],C:["C",[0,0]],C2:["C",[0,0]]},
  {A:["O1",[110,-30]],B:["O1",[-50,20]],C:["O2",[50,0]],C2:["O2",[50,0]]},

function lw(t){const m1=eio(seg(t,T1+.4,T1+1.5)),m2=eio(seg(t,T2+.4,T2+1.5));return[1-m1,m1*(1-m2),m2]}
function lshift(key,w){let x=0,y=0;if(!key)return[0,0];LAY.forEach((L,i)=>{x+=L[key][1][0]*w[i];y+=L[key][1][1]*w[i]});return[x,y]}
function sameIn(a,b,w){return LAY.reduce((s,L,i)=>s+(L[a][0]===L[b][0]?w[i]:0),0)}

      txt(tr,x+dx+64,y+10,{size:30,weight:500,ls:-.5});

  let err=null;const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});
  enc.configure({codec:"avc1.640033",width:W,height:H,bitrate:8_500_000,framerate:FPS,avc:{format:"avc"}});
  const N=Math.round(DUR*FPS);
  for(let i=0;i<N;i++){
    render(i/FPS);const img=ctx.getImageData(0,0,W,H);
    const f=new VideoFrame(img.data,{format:"RGBA",codedWidth:W,codedHeight:H,timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(f,{keyFrame:i%(FPS*2)===0});f.close();
    if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));
    if(err)throw err;if(onProgress&&i%30===0)onProgress(i/N);
  }
  await enc.flush();muxer.finalize();return new Uint8Array(target.buffer);
}
