function scene45(t){

    ctx.restore();
  }
  for(const e of edges){

  }

  if(nk>0){const [x,y]=gs(c,NOISE[1].fx,NOISE[1].fy);pill(x,y-40,"brak wspólnych śladów",{color:MUTED,size:16,a:nk})}
  if(t5>=28.4){
    const ca=eo5(seg(t5,28.5,29.2)),morph=eio(seg(t5,29.9,30.5));

    NEW_LINKS.forEach((m,i)=>{const k=eo(seg(t5,30.8+i*.12,31.4+i*.12));if(k<=0)return;const p=gs(c,...npos(m,t));ctx.save();ctx.strokeStyle=hexA(ACC,1-i*.2);ctx.lineWidth=3.2-i*.6;ctx.lineCap="round";strokePart(qpts(x,y,...p,.08),k);ctx.restore()});
    if(morph>0){ctx.save();ctx.fillStyle=ACC;ctx.shadowColor=hexA(ACC,.5);ctx.shadowBlur=20;ctx.beginPath();ctx.arc(x,y,10*morph,0,7);ctx.fill();ctx.restore();

      txt("Rozpoznano",px+32,py+50,{size:18,weight:500,color:ACC});
      txt("Kampania B",px+32,py+100,{size:40,weight:600,ls:-1.4});
      txt((.87*eo(seg(t5,32.2,33.2))).toFixed(2),px+pw-32,py+100,{size:40,weight:600,align:"right",color:ACC,ls:-1.2});
      [["Wspólny tracker",.41],["Ten sam szablon",.28],["Ta sama twarz",.18]].forEach(([nm,v],i)=>{

        ctx.fillStyle="#F0F0F5";rr(ctx,px+32,by+12,pw-64,8,4);ctx.fill();ctx.fillStyle=hexA(ACC,1-i*.25);rr(ctx,px+32,by+12,(pw-64)*(v/.45)*p,8,4);ctx.fill();

      ctx.save();ctx.globalAlpha*=n2;ctx.fillStyle="#fff";ctx.strokeStyle=ACC;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x2,yy,9,0,7);ctx.fill();ctx.stroke();ctx.restore();
      pill(x2+24,yy,"nowy wzorzec",{color:ACC,size:18,a:eo(seg(t5,34.7,35.2)),border:hexA(ACC,.3),align:"left",dot:ACC});
    }
  }
  ctx.restore();
}

const G=LOGO_GEOMETRY;const LP={front:new Path2D(G.front),back:new Path2D(G.back),hull:new Path2D(G.hull)};
function mixHex(a,b,k){const p=parseInt(a.slice(1),16),q=parseInt(b.slice(1),16);const c=[16,8,0].map(sh=>Math.round(lerp(p>>sh&255,q>>sh&255,k)));return`rgb(${c[0]},${c[1]},${c[2]})`}
function headlineMimic(t,a,b,rest){
  const k=eo5(seg(t,a,a+1.0)),o=1-eio(seg(t,b-0.6,b));const v=Math.min(k,o);if(v<=0)return;
  const f=seg(t,a+0.9,a+1.9),ck=eo(clamp(f*2.2)),glow=Math.sin(Math.PI*f);
  reveal(v,()=>{
    const word="mimic",space=" ",base=205;
    ctx.font='600 66px "Geist"';ctx.letterSpacing="-2.3px";
    const ww=ctx.measureText(word).width,sw=ctx.measureText(space).width,rw=ctx.measureText(rest).width;ctx.letterSpacing="0px";
    const x0=960-(ww+sw+rw)/2;
    ctx.save();if(glow>0.01){ctx.shadowColor=hexA(ACC,.55*glow);ctx.shadowBlur=28*glow}
    txt(word,x0,base,{size:66,weight:600,ls:-2.3,color:mixHex(INK,ACC,ck)});ctx.restore();
    txt(rest,x0+ww+sw,base,{size:66,weight:600,ls:-2.3});
  });
}
for(const k of Object.keys(G.letters))LP[k]=new Path2D(G.letters[k]);
function logoScene(t){
  if(t<35.2)return;
  const S=1.8,X0=960-((G.right+G.left)/2)*S,Y0=575-100*S;
  const fk=eo5(seg(t,35.4,36.4)),sk=eio(seg(t,36.3,37.1));
  if(sk>0){
    octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W,H);octx.setTransform(S,0,0,S,X0,Y0);
    octx.save();octx.translate(G.offset[0]*(sk-1),G.offset[1]*(sk-1));octx.fillStyle=ACC;octx.fill(LP.back);octx.restore();
    octx.globalCompositeOperation="destination-out";octx.fillStyle="#000";octx.strokeStyle="#000";octx.lineWidth=G.knock;octx.lineJoin="round";octx.fill(LP.hull);octx.stroke(LP.hull);octx.globalCompositeOperation="source-over";
    ctx.save();ctx.globalAlpha=fk;ctx.drawImage(off,0,0);ctx.restore();
  }
  ctx.save();ctx.translate(X0,Y0);ctx.scale(S,S);
  ctx.save();ctx.globalAlpha=fk;const mid=[G.m_width/2,50];const s0=lerp(.9,1,fk);ctx.translate(mid[0],mid[1]);ctx.scale(s0,s0);ctx.translate(-mid[0],-mid[1]);if(fk<1)ctx.filter=`blur(${((1-fk)*8).toFixed(1)}px)`;ctx.fillStyle=INK;ctx.fill(LP.front);ctx.restore();
  ["i1","m","i2","c"].forEach((k,i)=>{const st=36.8+i*.12;const lk=eo5(seg(t,st,st+0.9));if(lk<=0)return;ctx.save();ctx.globalAlpha=lk;ctx.translate((1-lk)*-24,0);if(lk<1)ctx.filter=`blur(${((1-lk)*6).toFixed(1)}px)`;ctx.fillStyle=INK;ctx.fill(LP[k]);ctx.restore()});
  ctx.restore();
  const tk=eo5(seg(t,37.9,38.9));
  if(tk>0)reveal(tk,()=>txt("Więcej zaufania do tego, co widzisz.",960,Y0+100*S+110,{size:36,weight:500,align:"center",color:"#3A3A44",ls:-.7}));
}

function render(tn){
  const t=warp(tn);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter="none";
  background(t,tn);
  scene45(t);
  scene123(t);
  headline(t,0.4,3.1,"Ufamy temu, co widzimy w sieci.");
  headline(t,3.2,6.3,"A fałszywki powielają się bez końca.");
  headlineMimic(t,6.6,13.5,"odczytuje ślady, które zostawiają.");
  headline(t,13.8,20.5,"Porównuje je i waży każdą przesłankę.");
  headline(t,20.8,28.9,"Z chaosu powstaje mapa kampanii.","Słabe podobieństwo nie łączy.");
  headline(t,29.3,37.0,"Nowa odsłona? Rozpoznana od razu.");
  progress(t);
  logoScene(t-2.6);
}

let playing=!params.has("export"),t0=performance.now(),cur=0;
const seek=document.getElementById("seek"),timeEl=document.getElementById("time"),playBtn=document.getElementById("play");
function loop(now){if(playing)cur=((now-t0)/1000)%DUR;render(cur);seek.value=cur;timeEl.textContent=cur.toFixed(2);requestAnimationFrame(loop)}
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?"pauza":"odtwórz";t0=performance.now()-cur*1000};
seek.oninput=()=>{cur=+seek.value;t0=performance.now()-cur*1000};
document.addEventListener("keydown",e=>{if(e.code==="Space"){playBtn.click();e.preventDefault()}});

async function exportMp4(onProgress){
  const {Muxer,ArrayBufferTarget}=Mp4Muxer;const target=new ArrayBufferTarget();
  const muxer=new Muxer({target,video:{codec:"avc",width:W,height:H,frameRate:FPS},fastStart:"in-memory"});
  let err=null;const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});
  enc.configure({codec:"avc1.640033",width:W,height:H,bitrate:10_000_000,framerate:FPS,avc:{format:"avc"}});
  const N=Math.round(DUR*FPS);
  for(let i=0;i<N;i++){
    render(i/FPS);const img=ctx.getImageData(0,0,W,H);
    const f=new VideoFrame(img.data,{format:"RGBA",codedWidth:W,codedHeight:H,timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
    enc.encode(f,{keyFrame:i%(FPS*2)===0});f.close();
    if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));
    if(err)throw err;if(onProgress&&i%30===0)onProgress(i/N);
  }
  await enc.flush();muxer.finalize();return new Uint8Array(target.buffer);
}
window.__exportMp4=exportMp4;
document.getElementById("exp").onclick=async()=>{playing=false;const b=document.getElementById("exp");const bytes=await exportMp4(p=>b.textContent=`eksport ${Math.round(p*100)}%`);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"video/mp4"}));a.download="mimic-film.mp4";a.click();b.textContent="eksport MP4"};

(async()=>{
  await Promise.all(['400 40px "Geist"','500 40px "Geist"','600 40px "Geist"'].map(f=>document.fonts.load(f)));
  window.__ready=true;
  if(params.has("t")){cur=+params.get("t");playing=false}

})();
