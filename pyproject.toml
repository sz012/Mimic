[project]
name = "mimic"
version = "0.1.0"
description = "Korelacja i grupowanie podejrzanych reklam/stron w kampanie (HackNation 2026, NASK)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "networkx>=3.3",
    "pyvis>=0.3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pillow>=10.4",
    "imagehash>=4.3",
    "datasketch>=1.6",
    "tldextract>=5.1",
    "dnspython>=2.6",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "open_clip_torch>=2.26"]
faces = ["insightface>=0.7", "onnxruntime>=1.18"]
video = ["opencv-python-headless>=4.10"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
