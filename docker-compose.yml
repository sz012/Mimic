services:
  web:
    build:
      context: .
      args:
        EXTRAS: ${MIMIC_EXTRAS:-video,ocr}
    command: ["uv", "run", "--no-sync", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MIMIC_ADLIB_FIXTURE: ${MIMIC_ADLIB_FIXTURE:-1}
    volumes:
      - ./data/raw:/srv/mimic/data/raw:ro
      - ./data/refs/images:/srv/mimic/data/refs/images:ro
      - ./data/cache:/srv/mimic/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  app:
    build:
      context: .
      args:
        EXTRAS: ${MIMIC_EXTRAS:-video,ocr}
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      MIMIC_ADLIB_FIXTURE: ${MIMIC_ADLIB_FIXTURE:-1}
    volumes:
      - ./data/raw:/srv/mimic/data/raw:ro
      - ./data/refs/images:/srv/mimic/data/refs/images:ro
      - ./data/cache:/srv/mimic/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  refresher:
    build:
      context: .
      args:
        EXTRAS: ${MIMIC_EXTRAS:-video,ocr}
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.refresh", "--loop"]
    profiles: ["refresh"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/cache:/srv/mimic/data/cache
